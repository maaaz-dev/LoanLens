name: LoanLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loanlens-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ML tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ml_service/requirements-runtime.txt

      - name: Install pinned ML runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml_service/requirements-runtime.txt

      - name: Run Python regression and contract tests
        run: python -m unittest discover -s ml_service/tests -v

  frontend-and-config-checks:
    name: Frontend syntax and configuration checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check web/js/app.js
          node --check web/js/intro.js

      - name: Validate XML configuration files
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          files = [Path("build.xml"), Path("web/WEB-INF/web.xml")]
          for path in files:
              ET.parse(path)
              print(f"XML OK: {path}")
          PY
